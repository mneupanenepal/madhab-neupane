media:
  input: media
  output: /media

content:
  - name: articles
    label: Articles
    type: collection
    path: content/articles
    filename: "{year}-{month}-{day}-{title}.md"

    view:
      fields:
        - title
        - language
        - date
        - category
        - featured
      primary: title
      sort:
        - date
        - title
      default:
        sort: date
        order: desc

    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: language
        label: Language
        type: select
        options:
          values:
            - name: en
              label: English
            - name: ne
              label: नेपाली
            - name: de
              label: Deutsch
        required: true

      - name: date
        label: Publication Date
        type: date
        required: true

      - name: category
        label: Category
        type: select
        options:
          values:
            - Analysis
            - Opinion
            - Reflection
            - Research
            - Development
            - Planning
            - Infrastructure
            - Society
            - Politics
            - Environment
            - Culture
            - Personal

      - name: topics
        label: Topics
        type: select
        options:
          multiple: true
          values:
            - Nepal
            - Karnali
            - Urban Development
            - Regional Development
            - Spatial Planning
            - Infrastructure
            - Governance
            - Decentralization
            - Social Justice
            - Environment
            - Climate Change
            - Disaster
            - Migration
            - Development
            - Politics
            - Society
            - Culture
            - Technology
            - Research

      - name: excerpt
        label: Excerpt
        type: text

      - name: featured_image
        label: Featured Image
        type: image
        options:
          path: articles

      - name: translation_group
        label: Translation Group
        type: string
        description: Use the same identifier for different language versions of the same article.

      - name: featured
        label: Featured Article
        type: boolean

      - name: body
        label: Content
        type: rich-text